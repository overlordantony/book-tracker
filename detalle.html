<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitácora de lectura — Detalle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/theme.js"></script>
  <link rel="manifest" href="manifest.json">
  <!-- Favicon: usa una de las imágenes de /icons/ (cámbiala aquí si prefieres otra) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="theme-color" content="#12151a">
  <!-- Compatibilidad con Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" ontent="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bitácora">
  <!-- Icono para iPhone y iPad -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script type="module" src="js/pwa.js"></script>
  <!-- Pie de página fijo (se edita en js/pie.js) -->
  <script type="module" src="js/pie.js"></script>
</head>

<body class="pagina-app">

  <header class="barra">
    <a class="logo-enlace" href="app.html" aria-label="Ir a la biblioteca"><img class="logo" src="icons/icon-192.png"
        alt="" width="40" height="40"></a>
    <h1 id="tituloLibro">Cargando…</h1>
    <div class="acciones">
      <button id="btnTema" class="boton-tema"></button>
      <button id="btnSalir" class="boton-fantasma">Salir</button>
    </div>
  </header>

  <p id="cuentaInactiva" class="vacio" hidden></p>

  <div id="contenidoApp" hidden>

    <div class="cabecera-detalle">
      <a href="app.html" id="linkVolver" class="volver">← Volver a la biblioteca</a>
      <p id="avisoSoloLectura" class="vacio" hidden>Estás viendo este libro en modo solo lectura.</p>

      <div id="avisoPapelera" class="aviso-papelera" hidden>
        <p id="textoPapelera">Este libro está en la papelera: no aparece en tu biblioteca ni en las estadísticas.</p>
        <div class="acciones-libro">
          <button type="button" id="btnRestaurarLibro" class="boton-fantasma">Restaurar libro</button>
          <button type="button" id="btnEliminarDefinitivo" class="boton-fantasma boton-borrar">Eliminar
            definitivamente</button>
        </div>
      </div>
      <p id="errorAccionLibro" class="error" role="alert" hidden></p>

      <div class="cabecera-detalle-cuerpo">
        <img id="portadaLibro" class="portada-grande" hidden alt="">
        <div>
          <p class="autor" id="autorLibro"></p>
          <p class="progreso" id="progresoLibro"></p>
          <div class="barra-progreso">
            <div class="barra-progreso-relleno" id="rellenoProgreso"></div>
          </div>
          <a id="linkTiendaLibro" href="#" target="_blank" rel="noopener" class="boton-fantasma"
            style="text-decoration:none; display:none; margin-top:.6rem;">Abrir ↗</a>
        </div>
      </div>

      <div class="acciones-libro">
        <a id="btnLeer" href="lector.html" class="boton-fantasma" style="text-decoration:none" hidden>Leer en la app</a>
        <button id="btnEditarLibro" class="boton-fantasma">Editar libro</button>
        <button id="btnExportarGuia" class="boton-fantasma">Exportar guía</button>
        <button id="btnPapelera" class="boton-fantasma boton-borrar">Mover a la papelera</button>
      </div>

      <form id="formEditarLibro" class="formulario-mini" hidden style="margin-top:.9rem">
        <div class="fila">
          <input type="text" id="editTitulo" placeholder="Título">
          <input type="text" id="editAutor" placeholder="Autor">
        </div>
        <div class="fila">
          <input type="url" id="editPortadaUrl" placeholder="URL de portada">
          <input type="url" id="editUrl" placeholder="URL de tienda">
        </div>
        <div class="fila">
          <input type="text" id="editGeneros" placeholder="Géneros (separados por coma)">
          <input type="text" id="editEtiquetas" placeholder="Etiquetas (separadas por coma)">
        </div>
        <div class="fila">
          <select id="editEstado">
            <option value="Pendiente">Pendiente</option>
            <option value="leyendo">Leyendo</option>
            <option value="pausado">Pausado</option>
            <option value="terminado">Terminado</option>
            <option value="descartado">Descartado</option>
          </select>
          <select id="editFormato">
            <option value="fisico">Físico</option>
            <option value="digital">Digital</option>
            <option value="audiolibro">Audiolibro</option>
          </select>
        </div>
        <div class="fila">
          <input type="number" id="editTotalPaginas" placeholder="Total páginas" min="0">
          <input type="number" id="editPaginaActual" placeholder="Página actual" min="0">
        </div>
        <div class="fila">
          <input type="date" id="editFechaInicio">
          <input type="date" id="editFechaFin">
        </div>
        <input type="number" id="editCalificacion" placeholder="Calificación (1-5)" min="1" max="5">
        <label class="etiqueta-campo" for="editNotas">Notas</label>
        <textarea id="editNotas" rows="3" placeholder="Notas"></textarea>
        <label class="etiqueta-campo" for="editObservaciones">Observaciones</label>
        <textarea id="editObservaciones" rows="2" placeholder="Observaciones"></textarea>
        <p id="errorEditarLibro" class="error" role="alert" hidden></p>
        <div style="display:flex;gap:.6rem">
          <button type="submit" class="boton-principal">Guardar cambios</button>
          <button type="button" id="btnCancelarEditarLibro" class="boton-fantasma">Cancelar</button>
        </div>
      </form>
    </div>

    <section class="resumen-detalle" aria-label="Resumen del libro">
      <div id="resumenTiles"></div>
      <div id="panelNotas" class="panel-notas"></div>
      <div id="panelActividad" class="panel-actividad"></div>
    </section>

    <nav class="subpestañas">
      <button class="pestaña activa" data-vista="capitulos">Capítulos</button>
      <button class="pestaña" data-vista="personajes">Personajes</button>
      <button class="pestaña" data-vista="citas">Citas</button>
      <button class="pestaña" data-vista="conceptos">Conceptos</button>
    </nav>

    <main>

      <section id="vistaCapitulos" class="vista">
        <form id="formCapitulo" class="formulario-mini">
          <div class="fila">
            <input type="number" id="capNumero" placeholder="N.º de capítulo" min="1" required>
            <input type="text" id="capTitulo" placeholder="Título del capítulo">
          </div>
          <div class="fila">
            <input type="number" id="capPagInicio" placeholder="Página inicio">
            <input type="number" id="capPagFin" placeholder="Página fin">
          </div>
          <textarea id="capResumen" rows="3" placeholder="Resumen"></textarea>
          <input type="text" id="capPuntos" placeholder="Puntos clave, separados por coma">
          <div style="display:flex;gap:.6rem">
            <button type="submit" class="boton-principal">Agregar capítulo</button>
            <button type="button" id="btnCancelarCapitulo" class="boton-fantasma" hidden>Cancelar edición</button>
          </div>
        </form>
        <div id="listaCapitulos"></div>
      </section>

      <section id="vistaPersonajes" class="vista" hidden>
        <form id="formPersonaje" class="formulario-mini">
          <div class="fila">
            <input type="text" id="perNombre" placeholder="Nombre" required>
            <input type="text" id="perRol" placeholder="Rol (ej. protagonista, aliado...)">
          </div>
          <select id="perRelevancia">
            <option value="principal">Principal</option>
            <option value="secundario">Secundario</option>
            <option value="menor">Menor</option>
            <option value="mencionado">Solo mencionado</option>
          </select>
          <input type="text" id="perAlias" placeholder="Alias/otros nombres, separados por coma">
          <textarea id="perDescripcion" rows="3" placeholder="Descripción"></textarea>
          <input type="text" id="perConexiones" placeholder="Asócialo con: ...">
          <div style="display:flex;gap:.6rem">
            <button type="submit" class="boton-principal">Agregar personaje</button>
            <button type="button" id="btnCancelarPersonaje" class="boton-fantasma" hidden>Cancelar edición</button>
          </div>
        </form>
        <div id="listaPersonajes"></div>
      </section>

      <section id="vistaCitas" class="vista" hidden>
        <form id="formCita" class="formulario-mini">
          <textarea id="citaTexto" rows="2" placeholder="Texto de la cita" required></textarea>
          <div class="fila">
            <input type="number" id="citaPagina" placeholder="Página">
            <input type="text" id="citaEtiqueta" placeholder="Etiqueta (ej. filosófica, de vida...)">
          </div>
          <textarea id="citaNota" rows="2" placeholder="Nota (opcional)"></textarea>
          <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--muted)">
            <input type="checkbox" id="citaFavorita" style="width:auto">
            Marcar como favorita (lista para compartir)
          </label>
          <div style="display:flex;gap:.6rem">
            <button type="submit" class="boton-principal">Agregar cita</button>
            <button type="button" id="btnCancelarCita" class="boton-fantasma" hidden>Cancelar edición</button>
          </div>
        </form>
        <div id="listaCitas"></div>
      </section>

      <section id="vistaConceptos" class="vista" hidden>
        <form id="formConcepto" class="formulario-mini">
          <input type="text" id="conNombre" placeholder="Concepto..." required>
          <textarea id="conSignificado" rows="3" placeholder="Qué recordar sobre este concepto"></textarea>
          <div style="display:flex;gap:.6rem">
            <button type="submit" class="boton-principal">Agregar concepto</button>
            <button type="button" id="btnCancelarConcepto" class="boton-fantasma" hidden>Cancelar edición</button>
          </div>
        </form>
        <div id="listaConceptos"></div>
      </section>

    </main>

  </div>

  <script type="module" src="js/detalle.js"></script>
  <script type="module" src="js/google-analytics.js"></script>
</body>

</html>
