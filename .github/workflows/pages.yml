# Despliega el sitio en GitHub Pages en cada push a main.
# Requiere: Settings → Pages → Source: "GitHub Actions".
# Opcional: guarda tu configuración de Firebase en el secreto FIREBASE_CONFIG_JSON
# (ver docs/FIREBASE.md §8) para no subir js/firebase-config.js al repositorio.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar js/firebase-config.js desde el secreto (si existe)
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf 'export const firebaseConfig = %s;\n' "$FIREBASE_CONFIG_JSON" > js/firebase-config.js
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
